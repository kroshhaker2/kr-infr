apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kr-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kroshhaker2/kr-infr.git
    targetRevision: main
    path: k8s-manifests/kr-server
  destination:
    server: https://kubernetes.default.svc
    namespace: kr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true