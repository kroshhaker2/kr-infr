apiVersion: apps/v1
kind: Deployment
metadata:
  name: kr-web
  labels:
    app: kr-web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: kr-web
  template:
    metadata:
      labels:
        app: kr-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: kr-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: API_URL
              value: {{ .Values.api_url }}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL