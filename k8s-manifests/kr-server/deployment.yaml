apiVersion: apps/v1
kind: Deployment
metadata:
  name: kr-server
  namespace: kr
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kr-server
  template:
    metadata:
      labels:
        app: kr-server
    spec:
      serviceAccountName: kr-server
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: kr-server
          image: ghcr.io/kroshhaker2/kr-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http

          envFrom:
            - configMapRef:
                name: kr-config
            - secretRef:
                name: kr-database

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - kr-server
                topologyKey: kubernetes.io/hostname
