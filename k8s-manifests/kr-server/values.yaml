image:
  repository: ghcr.io/kroshhaker2/kr-server
  tag: "1.1.2"
  pullPolicy: IfNotPresent

replicaCount: 3

imagePullSecrets:
  - name: ghcr-credentials

port: 3000

ingress:
  host: api.kr.kroshhaker.dev
  tlsSecretName: kr-server-tls
  clusterIssuer: letsencrypt-prod

database:
  secretName: kr-postgres-app
  secretKey: uri

migrate:
  enabled: true
