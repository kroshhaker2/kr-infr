image:
  repository: ghcr.io/kroshhaker2/kr-server
  tag: "1.1.2"
  pullPolicy: IfNotPresent

replicaCount: 3

port: 3000

ingress:
  host: api.kr.kroshhaker.dev
  tlsSecretName: kr-server-tls
  clusterIssuer: letsencrypt-prod

database:
  secretName: kr-postgres-app
  secretKey: uri

migrate:
  enabled: true


probes:
  path: /api/v1/health
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

rollout:
  successThreshold: 0.95
  steps:
    - setWeight: 20
    - pauseSeconds: 60
    - setWeight: 50
    - pauseSeconds: 60
    - setWeight: 100