---
# --- Административный пользователь ---
admin_user: "deploy"
admin_user_shell: /bin/bash
admin_user_groups:
  - sudo
admin_user_create_home: true

admin_user_ssh_public_key: ""

# --- SSH hardening ---
ssh_port: 2222

ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"
ssh_challenge_response_authentication: "no"
ssh_usepam: "yes"
ssh_x11_forwarding: "no"
ssh_max_auth_tries: 3
ssh_login_grace_time: 30

ssh_client_alive_interval: 60
ssh_client_alive_count_max: 3

# Опционально: жёсткое ограничение списка пользователей, которым
# разрешён SSH-логин. Пусто = директива AllowUsers не пишется.
ssh_allow_users: []
